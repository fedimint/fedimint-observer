[package]
name = "fmo_api_types"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = { version = "0.32.5", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
fedimint-core = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Not used directly: `netwatch` (via fedimint-core -> iroh) needs socket2's
# `all` feature but doesn't enable it, so building this crate without
# fmo_server in the same build (e.g. `-p fmo_prober`) fails otherwise.
socket2 = { version = "0.5", features = ["all"] }
