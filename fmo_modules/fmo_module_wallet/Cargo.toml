[package]
name = "fmo_module_wallet"
version = "0.2.0"
edition = "2021"
description = "Fedimint Observer support for the wallet (on-chain) module"

[dependencies]
anyhow = "1.0.81"
async-trait = "0.1.92"
bitcoin = "0.32.5"
fedimint-core = { workspace = true }
fedimint-wallet-common = { workspace = true }
fmo_core = { path = "../../fmo_core" }
serde_json = "1.0.115"
tracing = "0.1.40"
axum = { version = "0.7.5", features = ["json"] }
esplora-client = { version = "0.10.0", default-features = false, features = [
    "async-https-rustls",
] }
fedimint-api-client = { workspace = true }
fmo_api_types = { path = "../../fmo_api_types" }
futures = "0.3.30"
postgres-from-row = "0.5.2"
tokio = { version = "1.37.0", features = ["full"] }
