[package]
name = "fmo_module_stability_pool"
version = "0.2.0"
edition = "2021"
description = "Fedimint Observer support for Fedi's stability pool v1 module"

# Not a workspace member: stability-pool-common depends on an older
# fedimint-core, so this crate only builds once it supports the workspace's
# fedimint version. fmo_server pulls it in with --features stability_pool_v1.
[dependencies]
async-trait = "0.1.92"
fedimint-core = { version = "0.12.0", git = "https://github.com/fedimint/fedimint", tag = "v0.12.0" }
fmo_core = { path = "../../fmo_core" }
serde_json = "1.0.115"
stability-pool-common = { git = "https://github.com/tacio/fedi", branch = "fmo-compatible" }
