[package]
name = "fmo_module_v2"
version = "0.2.0"
edition = "2021"
description = "Fedimint Observer support for Fedimint v2 modules"

[dependencies]
anyhow = "1.0.81"
axum = { version = "0.7.5", features = ["json"] }
async-trait = "0.1.92"
fedimint-api-client = { workspace = true }
fedimint-core = { workspace = true }
fedimint-lnv2-common = { workspace = true }
fedimint-mintv2-common = { workspace = true }
fedimint-walletv2-common = { workspace = true }
fmo_api_types = { path = "../../fmo_api_types" }
fmo_core = { path = "../../fmo_core" }
serde_json = "1.0.115"
tracing = "0.1.40"
