[package]
name = "fmo_module_lnv2"
version = "0.2.0"
edition = "2021"
description = "Fedimint Observer lnv2 module"

[dependencies]
anyhow = "1.0.81"
async-trait = "0.1.92"
fedimint-core = { workspace = true }
fedimint-lnv2-common = { workspace = true }
fmo_core = { path = "../../fmo_core" }
serde_json = "1.0.115"
axum = { version = "0.7.5", features = ["json"] }
fedimint-api-client = { workspace = true }
futures = "0.3.30"
tokio = { version = "1.37.0", features = ["full"] }
tracing = "0.1.40"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4.38", features = ["serde"] }
fmo_api_types = { path = "../../fmo_api_types" }
iroh = { version = "=0.35.0", default-features = false }
iroh-next = { package = "iroh", version = "=1.0.3", default-features = false, features = ["tls-ring"] }

[dev-dependencies]
deadpool-postgres = "0.14.0"
tokio-postgres = { version = "0.7.11", features = ["with-serde_json-1", "with-chrono-0_4"] }

[dependencies.reqwest]
version = "0.12.2"
default-features = false
features = ["json", "rustls-tls"]
