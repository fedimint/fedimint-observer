[package]
name = "fmo_core"
version = "0.2.0"
edition = "2021"
description = "Module-agnostic core of Fedimint Observer: fetching, storage, API and shared services"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fedimint-api-client = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-meta-client = { workspace = true }
fedimint-wallet-common = { workspace = true }

anyhow = "1.0.81"
async-trait = "0.1.92"
axum = { version = "0.7.5", features = ["json"] }
axum-auth = "0.7.0"
bitcoin = "0.32.5"
esplora-client = { version = "0.10.0", default-features = false, features = [
    "async-https-rustls",
] }
fmo_api_types = { path = "../fmo_api_types" }
futures = "0.3.30"
hex = "0.4.3"
nostr-sdk = "0.34.0"
# Fedi's PeerBadge SDK, at the revision the Fedi app pins: verifies Manifold
# Guardians' trust credentials exactly as Fedi's app does
peerbadge-protocol = { git = "https://github.com/fedibtc/peerbadge-sdk", rev = "ad6e954301f6684dcef14b070332d7171b61a408" }
peerbadge-schemas = { git = "https://github.com/fedibtc/peerbadge-sdk", rev = "ad6e954301f6684dcef14b070332d7171b61a408" }
postgres-from-row = "0.5.2"
reqwest = { version = "0.12.2", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
subtle = "2.6.1"
tokio = { version = "1.37.0", features = ["full"] }
tokio-postgres = { version = "0.7.11", features = [
    "with-chrono-0_4",
    "with-serde_json-1",
] }
deadpool-postgres = "0.14.0"
native-tls = "0.2"
postgres-native-tls = "0.5.3"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "compression-gzip"] }
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10.4"
base64 = "0.22.1"
# Pinned like Manifold: its MG display names index these exact word lists
petname = { version = "=3.1.0", default-features = false, features = ["default-words"] }

[dev-dependencies]
# The digest type PeerBadge credentials use, for test revocations
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
