name: Nix build

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  nix-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - fmo_server
          - fmo_frontend_react_default

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build ${{ matrix.target }}
      run: nix build .#${{ matrix.target }}

    - name: Check build output
      run: ls -la result*

  v2-database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observer_v2_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test v2 migrations, accounting replay and instance pagination
        env:
          FMO_WALLETV2_TEST_DATABASE: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/observer_v2_test
          FMO_WORK_TEST_DATABASE: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/observer_v2_test
          FMO_LNV2_TEST_DATABASE: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/observer_v2_test
        run: |
          nix develop -c cargo test -p fmo_core postgres_commit_notifications_and_block_arrival -- --ignored
          nix develop -c cargo test -p fmo_module_walletv2 postgres_deposit_replay_and_instance_pagination -- --ignored
          nix develop -c cargo test -p fmo_module_lnv2 postgres_probe_history_and_activity -- --ignored
          nix develop -c cargo test -p fmo_module_lnv2 postgres_v2_migration_and_admission_trim_existing_records -- --ignored
          nix develop -c cargo test -p fmo_module_lnv2 postgres_gateway_nodes_read_current_registrations -- --ignored
          nix develop -c cargo test -p fmo_module_lnv2 postgres_gateway_nodes_read_one_snapshot -- --ignored
