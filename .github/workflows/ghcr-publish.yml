name: Create and publish a Docker image in ghcr.io
on:
  push:
    branches:
      - master
      - main
    tags:
      - v*
env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@7993355175c2765e5733dae74f3e0786fe0e5c4f # v12
      - name: Build fedimint-observer image
        run: |
          nix build -L .#fmo_server_image
          echo "fedimint_observer_container_tag=$(docker load < result | awk '{ print $3 }')" >> $GITHUB_ENV
      - name: Log in to the Container registry
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push fedimint-observer image to ghcr.io
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |-
          nix_tag="${{ env.fedimint_observer_container_tag }}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$IMAGE_TAG $GITHUB_REF_NAME"
          else
            tags="$IMAGE_TAG latest master"
          fi
          for tag in $tags; do
            hub_tag="$REGISTRY/$REPOSITORY:$tag"
            docker tag "$nix_tag" "$hub_tag"
            docker push "$hub_tag"
          done
