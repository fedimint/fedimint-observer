name: React Frontend CI

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
    paths:
      - 'fmo_frontend_react/**'
      - '.github/workflows/react-frontend-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'fmo_frontend_react/**'
      - '.github/workflows/react-frontend-ci.yml'

jobs:
  lint-and-build:
    name: Lint and Build React Frontend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: fmo_frontend_react/package-lock.json

    - name: Install dependencies
      working-directory: ./fmo_frontend_react
      run: npm ci

    - name: Run ESLint
      working-directory: ./fmo_frontend_react
      run: npm run lint

    - name: Build production bundle
      working-directory: ./fmo_frontend_react
      run: npm run build

    - name: Report bundle size
      working-directory: ./fmo_frontend_react
      run: |
        {
          echo "## Bundle size"
          echo '```'
          ls -lh dist/assets/*.js dist/assets/*.css | awk '{print $9, $5}'
          echo '```'
          echo "**Total JS:** $(du -ch dist/assets/*.js | grep total | awk '{print $1}')"
          echo "**Total CSS:** $(du -ch dist/assets/*.css | grep total | awk '{print $1}')"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: react-frontend-build
        path: fmo_frontend_react/dist/
        retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: lint-and-build

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: fmo_frontend_react/package-lock.json

    - name: Install dependencies
      working-directory: ./fmo_frontend_react
      run: npm ci

    - name: Build production bundle
      working-directory: ./fmo_frontend_react
      env:
        VITE_FMO_API_BASE_URL: 'https://observer.fedimint.org/api'
      run: npm run build

    - name: Copy index.html to 404.html for client-side routing
      working-directory: ./fmo_frontend_react
      run: cp dist/index.html dist/404.html

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./fmo_frontend_react/dist
        cname: observer-ng.fedimint.com
