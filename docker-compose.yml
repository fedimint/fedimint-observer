services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fmo
      # Only reachable from the fmo_server container: no port is published
      POSTGRES_PASSWORD: fmo
      POSTGRES_DB: fmo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmo -d fmo"]
      interval: 5s
      timeout: 5s
      retries: 5

  fmo_server:
    image: ghcr.io/fedimint/fedimint-observer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost only: put a reverse proxy in front to serve it publicly
      - "127.0.0.1:3000:3000"
    environment:
      FO_BIND: "0.0.0.0:3000"
      FO_DATABASE: "postgres://fmo:fmo@db:5432/fmo"
      # Required, e.g. `FO_ADMIN_AUTH=$(openssl rand -hex 32) docker compose up`
      FO_ADMIN_AUTH: "${FO_ADMIN_AUTH:?set FO_ADMIN_AUTH to a random secret}"
      FO_MEMPOOL_URL: "https://mempool.space/api"
      RUST_LOG: "info"

volumes:
  pgdata:
